name: portfolio-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Customer Retention project in editable mode
        run: python -m pip install -e "projects/customer-retention-analytics[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile project code
        run: python -m compileall -q projects scripts
      - name: Run test suite inside Docker Compose
        run: docker compose run --build --rm tests
