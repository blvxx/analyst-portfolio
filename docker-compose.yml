services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "pytest", "-q"]

  marketing:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "projects/01_marketing_analytics/run.py"]
    volumes:
      - ./projects/01_marketing_analytics/data:/app/projects/01_marketing_analytics/data
      - ./projects/01_marketing_analytics/outputs:/app/projects/01_marketing_analytics/outputs

  ecommerce:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "projects/02_ecommerce_analytics/run.py"]
    volumes:
      - ./projects/02_ecommerce_analytics/data:/app/projects/02_ecommerce_analytics/data
      - ./projects/02_ecommerce_analytics/outputs:/app/projects/02_ecommerce_analytics/outputs

  macro:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "projects/03_cis_macro_analytics/run.py"]
    environment:
      WB_START_YEAR: "${WB_START_YEAR:-2000}"
      WB_END_YEAR: "${WB_END_YEAR:-2024}"
    volumes:
      - ./projects/03_cis_macro_analytics/data:/app/projects/03_cis_macro_analytics/data
      - ./projects/03_cis_macro_analytics/outputs:/app/projects/03_cis_macro_analytics/outputs
